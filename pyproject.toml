[tool.cython-lint]
max-line-length = 160
ignore = ['E221', 'E222', 'E266']

[tool.ruff]
line-length = 160

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build]
artifacts = ["install"]
include = [
    "/LICENSE.md",
    "/README.md",
]
exclude = [
    "**/.gitignore",
    "pyproject.toml",
]

[tool.hatch.build.sources]
# NOTE: The build_wheel.sh script will replace this line with the correct Python version
# Pattern: "install/lib/pythonX.Y/site-packages/..." will be set dynamically
"install/lib" = "lib"
"install/bin" = "bin"

[tool.hatch.build.targets.wheel]
# NOTE: build_wheel.sh will set this to [] to use sources mapping only
packages = ["psana", "psalg"]

[tool.hatch.build.targets.wheel.force-include]
"install/lib/libxtc.so" = "psana/.libs/libxtc.so"
"install/lib/libpsalg.so" = "psana/.libs/libpsalg.so"
"install/lib/libutils.so" = "psana/.libs/libutils.so"
"install/lib/libgeometry.so" = "psana/.libs/libgeometry.so"
"install/lib/libcalib.so" = "psana/.libs/libcalib.so"
"install/lib/libdigitizer.so" = "psana/.libs/libdigitizer.so"
"install/lib/libdetector.so" = "psana/.libs/libdetector.so"
"install/lib/libshmemsrv.so" = "psana/.libs/libshmemsrv.so"
"install/lib/libshmemcli.so" = "psana/.libs/libshmemcli.so"

# Container build target: cp311 only for the first Podman run (widen to
# cp312/cp313 once this is confirmed working). See build_wheel_container.sh
# and docs/topics/psana-wheel-packaging.md (2026-07-29 sections) for the
# reasoning behind this before-all/before-build split -- most notably that
# MPI is deliberately NOT installed here because psana's C++/Cython code has
# no direct MPI linkage (mpi4py is a pure Python-level runtime dependency),
# confirmed by a repo-wide grep of every meson.build file.
[tool.cibuildwheel]
build = "cp311-*"
skip = "pp* *-musllinux*"
# WORKAROUND (2026-07-29): create-args added to unblock a rootless-cgroup
# permission failure specific to sdfiana023's Weka-backed cgroup mount --
# see PODMAN_TEST_LOG.md. cgroupns=host and disable-host-mount added per
# review (Thorsten, via boss), matching the manually-confirmed working
# `podman run --runtime ~/bin/crun --cgroups=disabled --cgroupns=host`
# command, and avoiding cibuildwheel's default `--volume=/:/host` bind
# mount of the entire host filesystem (which includes Weka-backed paths)
# into the container. Once the node/infra team fixes proper cgroup
# delegation, this can revert to the plain form:
#   container-engine = "podman"
#
# NOTE: the explicit --runtime path below is account-specific
# (/sdf/home/m/mavaylon/bin/crun only exists under this user's home
# directory) and is redundant with ~/.config/containers/containers.conf,
# which already sets crun as the default runtime and was confirmed working
# in the prior run. Added anyway for an explicit, self-contained config.
# Anyone else running this needs their own crun at their own path, either
# via their own containers.conf or by changing this path to match.
container-engine = { name = "podman", create-args = ["--runtime", "/sdf/home/m/mavaylon/bin/crun", "--cgroups=disabled", "--cgroupns=host"], disable-host-mount = true }

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
before-all = [
    "dnf install -y libcurl-devel",
    # AlmaLinux 8's rapidjson-devel is the stale upstream v1.1.0 tag from
    # 2016 -- its GenericStringRef assignment operator assigns to a const
    # member, which GCC 14 rejects as a hard error under C++20. No RPM
    # repo (including EPEL) has ever packaged anything newer, because
    # RapidJSON itself hasn't tagged a release since 2016. Upstream's
    # master branch has the fix (operator= declared deleted); pulled
    # directly from GitHub, pinned to a specific commit for
    # reproducibility, rather than relying on the broken dnf package.
    "curl -sL https://github.com/Tencent/rapidjson/archive/24b5e7a8b27f42fa16b96fc70aade9106cf7102f.tar.gz | tar xz -C /tmp",
    "cp -r /tmp/rapidjson-24b5e7a8b27f42fa16b96fc70aade9106cf7102f/include/rapidjson /usr/include/",
]
before-build = [
    # numpy must be installed before build_wheel_container.sh runs --
    # meson.build's numpy_inc lookup shells out to `python3 -c "import
    # numpy; ..."` to find its include path, which silently fails/returns
    # nothing if numpy isn't already installed in this container.
    "pip install meson ninja cython hatchling numpy",
    "bash {project}/build_wheel_container.sh",
]
