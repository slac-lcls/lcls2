[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "psana"
version="4.3"
requires-python = ">=3.11"  # Source code supports Python 3.11+

# Core dependencies identified via AST-based import analysis (2026-07-18),
# corrected 2026-08-27: a fresh-env install test found six of these
# (amitypes/amityping, krtc, prometheus_client, pymongo, pyzmq, kafka) are
# imported unconditionally in the core DataSource chain, not gated behind
# any optional feature -- five were misfied as optional extras below and
# two (krtc, kafka) weren't declared anywhere. See stanford-knowledge-base
# decisions/2026-08-27-wheel-dependency-classification-gaps.md.
# Analysis excluded psdaq/ (not packaged in wheel, only built with build_daq=true)
dependencies = [
    "numpy",        # 289 imports, 245 files - core array operations
    "h5py",         # 14 imports, 14 files - HDF5 file I/O
    "mpi4py",       # 42 imports, 35 files - parallel processing (requires system MPI)
    "matplotlib",   # 37 imports, 25 files - plotting
    "scipy",        # 27 imports, 17 files - scientific computing
    "requests",     # 10 imports, 10 files - HTTP requests
    "psutil",       # 14 imports, 12 files - system utilities
    # amitypes is the import name; amityping is the distribution name, only
    # published on the lcls-ii conda channel, not PyPI -- pulled directly
    # from git instead. Pinned to the commit the 1.3.0 tag resolved to
    # (verified 2026-08-27) rather than the tag itself, matching the
    # rapidjson pin's reproducibility rationale below -- tags are mutable.
    "amityping @ git+https://github.com/slac-lcls/amityping.git@f17e33641d69e0788d3c7fbabeceb162bcfb4bba",
    "lcls-krtc",       # import name 'krtc' -- Kerberos auth for calib-web access (MDBWebUtils/CalibConstants)
    "prometheus_client",  # psexp/prometheus_manager.py, core DataSource chain
    "pymongo",         # provides bson.objectid.ObjectId, used by pscalib/calib/MDBUtils.py
    "pyzmq",           # import name 'zmq'
    "kafka-python",    # import name 'kafka' -- psexp/ds_base.py, core DataSource chain
]

[project.optional-dependencies]
# GUI tools (graphqt applications)
gui = [
    "PyQt5",  # 231 imports, 99 files
]

# Analysis packages
analysis = [
    "scikit-learn",  # 3 imports, 2 files
    "pywt",          # 1 import - wavelets
    "opencv-python", # cv2 - Python-only, no C-level OpenCV linkage in the wheel
]

# Machine learning / advanced computing
ml = [
    "dask",   # 2 imports, 1 file
    "cupy",   # 2 imports, 1 file - GPU arrays
    "torch",  # 2 imports, 1 file - PyTorch
]

# All optional dependencies
all = [
    "PyQt5",
    "scikit-learn",
    "pywt",
    "opencv-python",
    "dask",
    "cupy",
    "torch",
]

