name: Check psana documentation

on:
  pull_request:
    branches: [features/psana2-gpu]
    paths:
      - 'psana/**'
      - 'AGENTS.md'
      - '.github/workflows/check_psana_docs.yml'
  push:
    branches: [features/psana2-gpu]
    paths:
      - 'psana/**'
      - 'AGENTS.md'
      - '.github/workflows/check_psana_docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  event-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # Source anchors resolve against the reviewed commit.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate generated HTML and source provenance
        run: python psana/docs/architecture/event-flow/build.py --check --check-source-drift
      - name: Install browser tooling
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Check offline interactions and downloads
        run: python psana/docs/architecture/event-flow/browser_check.py --artifacts /tmp/psana-docs-check
      - name: Save viewer and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: psana-event-flow-preview
          path: |
            psana/docs/architecture/event-flow/index.html
            /tmp/psana-docs-check/
          retention-days: 14
