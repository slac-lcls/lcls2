name: Test psana
on:
  # TEMP: remove this push trigger before merging to main. workflow_dispatch
  # only works once a workflow exists on the default branch, so pushing to
  # this branch is how we get CI status on the PR while iterating.
  push:
    branches:
      - ci_daq
  schedule:
    - cron: '0 5 * * *'  # once per day at midnight ET
  workflow_dispatch:

jobs:
  build-lcls-ii:
    runs-on: ubuntu-latest
    env:
      LCLS_CALIB_HTTP: "https://pswww.slac.stanford.edu/calib_ws/"
    defaults:
      run:
        # Bash shells do not use ~/.profile (for env variables) or ~/.bashrc,
        # so these shells need to be explicitly declared.
        # This makes the shell a login shell, which typically
        # sources said files. This is needed for conda.
        # Refer: https://github.com/marketplace/actions/setup-miniconda
        shell: bash -el {0}  
    steps:
      - name: Checkout repo with submodules
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          auto-update-conda: true
          activate-environment: build-conda-env
          channels: lcls-ii, conda-forge
          environment-file: .daq_20250402_r9.txt

      - name: Build
        run: |
          # build_all.sh now requires ENV_TYPE to be set before it will run
          # at all (normally done by sourcing setup_env.sh, which is S3DF/CDS
          # specific and won't work on a GitHub-hosted runner). "legacy" is
          # the same value setup_env.sh itself sets.
          # Deliberately NOT passing -d here: in the current build_all.sh,
          # -d turns the DAQ build ON (this flipped from the older version of
          # the script, where -d turned it OFF) -- this workflow only tests
          # psana, so the DAQ build should stay off.
          export ENV_TYPE=legacy
          ./build_all.sh

      - name: Run Tests
        run: |
          export PATH=$(pwd)/install/bin:${PATH}
          SITE_PACKAGES=$(python -c "import sys; print(f'$(pwd)/install/lib/python{sys.version_info.major}.{sys.version_info.minor}/site-packages')")
          export PYTHONPATH=${SITE_PACKAGES}:${PYTHONPATH}
          pytest psana/psana/tests/test_HBins.py \
                 psana/psana/tests/test_Time.py \
                 psana/psana/tests/test_TimeFormat.py \
                 psana/psana/tests/test_TimeParse.py \
                 psana/psana/tests/test_dgramedit.py \
                 psana/psana/tests/test_dgraminit.py \
                 psana/psana/tests/test_epix_calib.py \
                 psana/psana/tests/test_hsd.py \
                 psana/psana/tests/test_packetfooter.py \
                 psana/psana/tests/test_psalg.py \
                 psana/psana/tests/test_py2xtc.py \
                 psana/psana/tests/test_py2xtc_scan.py \
                 psana/psana/tests/test_pyalgos.py \
                 psana/psana/tests/test_sample.py \
                 psana/psana/tests/test_timetool.py \
                 psana/psana/tests/test_ts.py \
                 psana/psana/tests/test_xtc.py
